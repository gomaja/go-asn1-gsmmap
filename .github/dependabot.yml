version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    # go-asn1 and go-sms are consumed from their main branches, which carry
    # no tags; they are updated with `go get <module>@<main commit>`.
    # Their deleted tags are still served by the module proxy, and Dependabot
    # would propose them as updates.
    ignore:
      - dependency-name: github.com/gomaja/go-asn1
      - dependency-name: github.com/gomaja/go-sms
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - '*'

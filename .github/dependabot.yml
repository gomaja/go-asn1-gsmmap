version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    # The gomaja modules are consumed from their main branches and updated
    # with `go get <module>@<main commit>`. The deleted tags of go-asn1 and
    # go-sms are still served by the module proxy, and Dependabot would
    # propose them, or any tag the other three publish, as updates.
    ignore:
      - dependency-name: github.com/gomaja/go-asn1
      - dependency-name: github.com/gomaja/go-sms
      - dependency-name: github.com/gomaja/go-tbcd
      - dependency-name: github.com/gomaja/go-gad
      - dependency-name: github.com/gomaja/go-3gpp-identity
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - '*'
